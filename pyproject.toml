[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cxrtrust"
version = "0.2.0"
description = "Calibrated and explainable multi-label chest X-ray classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dang Truong Minh Le", email = "dang.le@mbzuai.ac.ae" }]
dependencies = ["torch>=2.3", "torchvision>=0.18", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "Pillow>=9.5", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]
vlm = ["open_clip_torch>=2.24", "transformers>=4.40"]

[tool.setuptools.packages.find]
include = ["cxrtrust*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
