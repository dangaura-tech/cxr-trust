seed: 0

model:
  backbone: densenet121
  pretrained: true
  dropout: 0.0
  pooling: avg

loss:
  name: bce
  class_balanced: false

data:
  image_size: 320
  uncertainty_policy: ones

train:
  epochs: 5
  batch_size: 32
  eval_batch_size: 64
  num_workers: 8
  lr: 1.0e-4
  head_lr_mult: 10.0
  weight_decay: 1.0e-5
  warmup_epochs: 0.5
  grad_clip: 5.0
  amp: true
  ema_decay: 0.999
  log_interval: 100
